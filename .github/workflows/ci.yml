name: macOS 26 build

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test --jobs 4
      - name: Build arm64 release binary
        run: swift build --configuration release --arch arm64
      - name: Check candidate verifier syntax
        run: zsh -n scripts/verify-candidate.sh
